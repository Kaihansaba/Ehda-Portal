<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Ehda Portal</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f8fb;
        }

        .card {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            color: #b71c1c;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 25px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #b71c1c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #8f1515;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #b71c1c;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="card">

    <h1>Reset Your Password</h1>

    <p>
        Enter your email address and we will send you
        instructions to reset your password.
    </p>

    <form method="POST">
        {% csrf_token %}

        {{ form.email.errors }}

        <label for="id_email">
            Email Address
        </label>

        {{ form.email }}

        <button type="submit">
            Send Reset Link
        </button>
    </form>

    <a href="{% url 'login' %}" class="back">
        Back to Login
    </a>

</div>

</body>
</html>
