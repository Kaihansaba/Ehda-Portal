<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Access Denied | Ehda Portal</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f5f8fb;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 90%;
            max-width: 600px;
            background: white;
            padding: 50px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        }

        .icon {
            font-size: 60px;
            margin-bottom: 20px;
        }

        h1 {
            color: #b71c1c;
            margin-bottom: 15px;
        }

        p {
            color: #666;
            font-size: 17px;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .back-btn {
            display: inline-block;
            background: #b71c1c;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }

        .back-btn:hover {
            background: #8f1515;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">🔒</div>

    <h1>Access Denied</h1>

    <p>
        You do not have permission to access this page.
        Please return to your dashboard.
    </p>

    <a href="{% url 'role_redirect' %}" class="back-btn">
        Back to My Dashboard
    </a>

</div>

</body>
</html>
