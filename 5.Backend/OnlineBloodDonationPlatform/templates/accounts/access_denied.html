{% extends "base.html" %}

{% block title %}Access denied{% endblock %}

{% block content %}
<div class="error-page">
    <svg viewBox="0 0 120 100" aria-hidden="true" focusable="false">
        <rect x="28" y="42" width="64" height="50" rx="8" fill="#fff" stroke="#5f5654" stroke-width="3"/>
        <path d="M40 42V30a20 20 0 0 1 40 0v12" fill="none" stroke="#5f5654" stroke-width="3" stroke-linecap="round"/>
        <path d="M60 58s-8 9-8 14a8 8 0 0 0 16 0c0-5-8-14-8-14z" fill="#b3261e"/>
    </svg>
    <p class="error-code">Error 403</p>
    <h1>You don’t have access to this page</h1>
    <p>This page is for a different type of account (donor, hospital or administrator).</p>

    <div class="cluster">
        <a href="{% url 'role_redirect' %}" class="btn btn-primary">Back to my dashboard</a>
        <a href="{% url 'index' %}" class="btn btn-ghost">Go to the home page</a>
    </div>
</div>
{% endblock %}
