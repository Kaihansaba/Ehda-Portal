<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Create New Password | Ehda Portal</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f8fb;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 45px;
            border-radius: 18px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        h1 {
            color: #b71c1c;
        }

        p {
            color: #666;
            line-height: 1.6;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #b71c1c;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #8f1515;
        }

        .errorlist {
            color: #b71c1c;
        }
    </style>
</head>

<body>

<div class="card">

    {% if validlink %}

        <h1>Create New Password</h1>

        <p>
            Enter your new password below.
        </p>

        <form method="POST">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">
                Change Password
            </button>
        </form>

    {% else %}

        <h1>Invalid Reset Link</h1>

        <p>
            This password-reset link is invalid or has already been used.
        </p>

        <a href="{% url 'password_reset' %}">
            Request a New Link
        </a>

    {% endif %}

</div>

</body>
</html>
