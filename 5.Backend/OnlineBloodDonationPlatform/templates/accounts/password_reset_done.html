<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Check Your Email | Ehda Portal</title>

    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f5f8fb;
            font-family: Arial, sans-serif;
        }

        .card {
            width: 90%;
            max-width: 550px;
            background: white;
            padding: 45px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

        .icon {
            font-size: 55px;
        }

        h1 {
            color: #b71c1c;
        }

        p {
            color: #666;
            line-height: 1.6;
            font-size: 17px;
        }

        a {
            display: inline-block;
            margin-top: 20px;
            background: #b71c1c;
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="card">

    <div class="icon">📧</div>

    <h1>Check Your Email</h1>

    <p>
        If an account exists with that email address,
        password-reset instructions have been sent.
    </p>

    <a href="{% url 'login' %}">
        Back to Login
    </a>

</div>

</body>
</html>
