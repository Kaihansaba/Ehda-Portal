{% comment %}
    Message shown when there is nothing to list.
    Parameters: title, text, action_url, action_label (all optional except title).
{% endcomment %}
<div class="empty-state">
    <svg viewBox="0 0 120 100" aria-hidden="true" focusable="false">
        <path fill="none" stroke="#b3261e" stroke-width="3" d="M52 10S32 32 32 46a20 20 0 0 0 40 0C72 32 52 10 52 10z"/>
        <circle cx="80" cy="64" r="14" fill="#fff" stroke="#5f5654" stroke-width="3"/>
        <path stroke="#5f5654" stroke-width="5" stroke-linecap="round" d="m90 74 12 12"/>
    </svg>

    <h3>{{ title }}</h3>

    {% if text %}
        <p>{{ text }}</p>
    {% endif %}

    {% if action_url %}
        <a href="{{ action_url }}" class="btn btn-secondary">{{ action_label }}</a>
    {% endif %}
</div>
