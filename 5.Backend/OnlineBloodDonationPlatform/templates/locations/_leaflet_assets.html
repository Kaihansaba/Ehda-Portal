<!-- Leaflet 1.9.4 from a CDN (free, no API key). Map tiles: OpenStreetMap. -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
>
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>

<style>
    .map {
        height: 420px;
        width: 100%;
        border-radius: 14px;
        border: 1px solid #e3e3e3;
        z-index: 0;
    }

    .map-hint {
        color: #777;
        font-size: 13px;
        margin: 10px 0 0;
    }
</style>

<script>
    // Shared helper: create a Leaflet map with OpenStreetMap tiles.
    function createOsmMap(elementId, center) {
        const map = L.map(elementId).setView([center.lat, center.lng], center.zoom || 6);

        L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
            maxZoom: 19,
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
        }).addTo(map);

        return map;
    }
</script>
