
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donor Map | Ehda</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    >

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 24px;
            color: #333;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .panel {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        a {
            color: #c62828;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        select, button {
            padding: 10px;
            border-radius: 6px;
            border: 1px solid #ccc;
        }

        button {
            background: #c62828;
            color: white;
            border: none;
            cursor: pointer;
        }

        #map {
            width: 100%;
            height: 480px;
            border-radius: 8px;
            background: #eee;
        }

        .legend {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-top: 15px;
        }

        .donor-marker {
            color: #c62828;
            font-weight: bold;
        }

        .facility-marker {
            color: #1565c0;
            font-weight: bold;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            #map {
                height: 380px;
            }
        }
    </style>
</head>

<body>
<div class="container">
    <div class="panel">
        <h1>Blood Donor Map</h1>
        <p>Explore approximate donor locations and active blood facilities.</p>

        <a href="{% url 'locations:search' %}">← Back to Donor Search</a>
        <span> | </span>
        <a href="{% url 'donor_dashboard' %}">Dashboard</a>
    </div>

    <div class="panel">
        <form method="get">
            <label for="blood_type">Filter by blood type</label>
            <select name="blood_type" id="blood_type">
                <option value="">All blood types</option>
                {% for value, label in blood_type_choices %}
                    <option value="{{ value }}"
                        {% if blood_type == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                {% endfor %}
            </select>
            <button type="submit">Apply Filter</button>
        </form>

        <p>Donors displayed: <strong>{{ donor_count }}</strong></p>

        <div class="legend">
            <span class="donor-marker">● Donors</span>
            <span class="facility-marker">● Facilities</span>
        </div>
    </div>

    <div class="panel">
        <div id="map" role="region" aria-label="Map of approximate donor locations and facilities"></div>
        <p id="map-status" aria-live="polite"></p>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

{{ map_data|json_script:"map-data" }}

<script>
    const data = JSON.parse(
        document.getElementById("map-data").textContent
    );

    const center = data.center || {lat: 33.9391, lng: 67.7100, zoom: 6};

    const map = L.map("map").setView(
        [Number(center.lat), Number(center.lng)],
        Number(center.zoom || 6)
    );

    const maptilerKey = "{{ maptiler_api_key|escapejs }}";

    L.tileLayer(
        `https://api.maptiler.com/maps/streets-v2/{z}/{x}/{y}.png?key=${encodeURIComponent(maptilerKey)}`,
        {
            attribution: '&copy; <a href="https://www.maptiler.com/copyright/">MapTiler</a> &copy; OpenStreetMap contributors',
            maxZoom: 19
        }
    ).addTo(map);

    let markersAdded = 0;

    (data.donors || []).forEach(function (donor) {
        const lat = Number(donor.lat);
        const lng = Number(donor.lng);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

        L.circleMarker([lat, lng], {
            radius: 8,
            color: "#c62828",
            fillColor: "#e53935",
            fillOpacity: 0.8
        })
        .bindPopup(
            "<strong>Donor:</strong> " + escapeHtml(donor.name) +
            "<br><strong>Blood type:</strong> " + escapeHtml(donor.blood_type)
        )
        .addTo(map);

        markersAdded++;
    });

    (data.facilities || []).forEach(function (facility) {
        const lat = Number(facility.lat);
        const lng = Number(facility.lng);

        if (!Number.isFinite(lat) || !Number.isFinite(lng)) return;

        const details = [
            "<strong>" + escapeHtml(facility.name) + "</strong>",
            escapeHtml(facility.type_label || facility.type || "Facility"),
            facility.address ? escapeHtml(facility.address) : "",
            facility.phone ? "Phone: " + escapeHtml(facility.phone) : ""
        ].filter(Boolean).join("<br>");

        L.circleMarker([lat, lng], {
            radius: 7,
            color: "#1565c0",
            fillColor: "#1e88e5",
            fillOpacity: 0.85
        })
        .bindPopup(details)
        .addTo(map);

        markersAdded++;
    });

    document.getElementById("map-status").textContent =
        markersAdded === 0
            ? "No donor locations or active facilities are available to display."
            : "Map loaded. " + markersAdded + " locations displayed.";

    function escapeHtml(value) {
        return String(value ?? "").replace(/[&<>"']/g, function (char) {
            return {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            }[char];
        });
    }
</script>
</body>
</html>
