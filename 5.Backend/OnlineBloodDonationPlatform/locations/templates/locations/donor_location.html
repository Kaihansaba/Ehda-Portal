
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Location - Ehda Portal</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 850px; margin: 40px auto; padding: 20px; color: #333; }
        .card { border: 1px solid #ddd; border-radius: 10px; padding: 24px; }
        button { padding: 10px 18px; cursor: pointer; }
        a { margin-right: 12px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>My Location</h1>
        <p>Set your approximate location so nearby donors can be found more easily.</p>

        {% if has_location %}
            <p>Your location has been saved.</p>
        {% else %}
            <p>You have not saved your location yet.</p>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Save Location</button>
        </form>

        <p>
            <a href="{% url 'locations:search' %}">Search Donors</a>
            <a href="{% url 'locations:map' %}">View Donor Map</a>
            <a href="{% url 'donor_dashboard' %}">Dashboard</a>
        </p>
    </div>
</body>
</html>
